name: Managed-beta probe location E2E

on:
  pull_request:
    paths:
      - ".github/workflows/managed-beta-probe-location-e2e.yml"
      - "managed-beta/**"
      - "scripts/assert-managed-beta-test-fleet.mjs"
      - "scripts/run-managed-beta-probe-location-e2e.sh"
      - "scripts/serve-prometheus-textfiles.py"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-location-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out test-fleet harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate this workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/managed-beta-probe-location-e2e.yml

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.1"

      - name: Exercise exact probe source, vendored rules, and test-fleet evidence policy
        shell: bash
        run: bash scripts/run-managed-beta-probe-location-e2e.sh
